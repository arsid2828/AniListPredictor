[auth]
# Local development:
# redirect_uri = "http://localhost:8501/oauth2callback"
#
# Streamlit Community Cloud:
# redirect_uri = "https://YOUR_APP.streamlit.app/oauth2callback"
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[access]
# Only these Google accounts can enter the app after successful Google login.
# You can use plain emails in Streamlit secrets because secrets are not committed.
allowed_emails = ["you@example.com"]

# Optional: use SHA-256 hashes of lowercase email addresses instead of, or in
# addition to, plain emails. Example PowerShell:
# "you@example.com" | ForEach-Object {
#   $bytes = [Text.Encoding]::UTF8.GetBytes($_.Trim().ToLower())
#   ([Security.Cryptography.SHA256]::Create().ComputeHash($bytes) |
#     ForEach-Object ToString x2) -join ""
# }
allowed_email_hashes = []

# App-level session cap. Streamlit identity cookies can persist up to 30 days,
# so the app expires its own session state sooner.
session_max_minutes = 720

# Development only. Leave false or delete in production.
disable_auth_for_local_dev = false

[app]
display_timezone = "Europe/Rome"
